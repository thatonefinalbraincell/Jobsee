name: Deploy Infrastructure Production
on:
  push:
    branches: [ main ]

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node Environment Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package.json'

      - name: Validate Backend Production Compilation
        run: |
          cd backend
          npm ci
          npm run build